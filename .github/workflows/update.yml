name: 每周更新数据与预测

on:
  schedule:
    - cron: "0 6 * * 1,4"   # 每周一、周四 06:00 UTC
  workflow_dispatch:         # 也可在 Actions 页面手动点击运行

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m src.update
      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "自动更新数据与预测"
          git push

